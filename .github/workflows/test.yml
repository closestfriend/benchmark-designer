name: test

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -I scripts/scorer_redteam.py --self-test
      - run: python -I scripts/stats.py --demo
      - run: python -I scripts/judge_meta_eval.py --self-test
